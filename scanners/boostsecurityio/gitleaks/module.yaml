api_version: 1.0

id: boostsecurityio/gitleaks
name: Gitleaks
namespace: boostsecurityio/gitleaks
scan_types:
  - secrets

config:
  support_diff_scan: true

setup:
- name: Download Gitleaks
  environment:
    VERSION: 8.30.1
    LINUX_X86_64_SHA: d9f45c50708544498785365e9167464113841af92c16914856af4d97b4e8c4a0
    LINUX_ARM64_SHA: c7be55eb4cdb6d269c88f849f95cfeb3716fa893e588e173bacd75e14c17c932
    MACOS_ARM64_SHA: 52bd256b02f4db728e72a22b2c6140a27728cd624281160b9e46cbcb01bc8810
  run: |
    BINARY_URL="https://assets.build.boostsecurity.io/scanners/gitleaks/gitleaks-${VERSION}"
    ARCH=$(uname -m)

    case "$(uname -sm)" in
      "Linux x86_64")
        BINARY_URL="${BINARY_URL}/linux/amd64/gitleaks.gz"
        SHA="${LINUX_X86_64_SHA} gitleaks.gz"
        ;;
      "Linux aarch64")
        BINARY_URL="${BINARY_URL}/linux/arm64/gitleaks.gz"
        SHA="${LINUX_ARM64_SHA} gitleaks.gz"
        ;;
      "Darwin arm64")
        BINARY_URL="${BINARY_URL}/darwin/arm64/gitleaks.gz"
        SHA="${MACOS_ARM64_SHA} gitleaks.gz"
        ;;
      *)
        echo "Unsupported machine: ${OPTARG}"
        exit 1
        ;;
    esac

    curl -o gitleaks.gz -fsSL "${BINARY_URL}"
    echo "${SHA}" | sha256sum --check

    gunzip gitleaks.gz
    chmod +x gitleaks
    
- name: Copy Boost Gitleaks Rules
  run: |
      cp $REGISTRY_MODULE_PATH/boost.toml $SETUP_PATH/

steps:
  - scan:
      format: sarif
      command:
        environment:
          GITLEAKS_CONFIG: ${GITLEAKS_CONFIG:-}
        run: |
          [ -z "$GITLEAKS_CONFIG" ] && [ -z "$GITLEAKS_CONFIG_TOML" ] && [ ! -f ".gitleaks.toml" ] && cp $SETUP_PATH/boost.toml .gitleaks.toml || true
          $SETUP_PATH/gitleaks dir --no-banner --exit-code 0 --report-format sarif --report-path $SETUP_PATH/gitleaks-output.sarif -l error --max-decode-depth=2 .
          cat $SETUP_PATH/gitleaks-output.sarif
      post-processor:
        - docker:
            command: process
            image: ghcr.io/boostsecurityio/scanner-publishing/boost-scanner-gitleaks:4201d0c@sha256:cc665601640530c3d9484ca964732d95bc5ad7dbb8b2eca6fa49da43e930331c
        - docker:
            command: process
            image: ghcr.io/boostsecurityio/scanner-publishing/boost-scanner-keyscope:458e3dd@sha256:6b611b085271e2c8ed15590f536fd4a29221a11752ef7525bbb60be9ad241902
            environment:
              VALIDATE_SECRET: ${GITLEAKS_VALIDATE_SECRETS:-}
