title = "Custom Boost Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"


    [[rules.allowlists]]
    description = "Don't report on URI"
    regexTarget = "match"
    regexes = [
        '''(?i)(?:[\w]+\.)+[\w]+:(?:6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{1,4}|[1-9][0-9]{1,3}|[1-9][0-9]{1,2}|[1-9][0-9]?)(?:/[\w]+)+''',
    ]
    
    [[rules.allowlists]]
    regexTarget = "line"  
    regexes = [ '''(?i)publicKeyToken="[^"]+"''' ]
    paths = [ '''(?i)web\.config''' ]
    
    [[rules.allowlists]]
    description = "Don't report on translation"
    regexTarget = "line"
    regexes = [ '''(?i)xmi:type="utility:TranslatableString"''' ]
    paths = [ '''(?i)\.msgflow$''' ]