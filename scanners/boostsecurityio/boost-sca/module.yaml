api_version: 1.0

id: boostsecurityio/boost-sca
name: BoostSecurity SCA
namespace: boostsecurityio/boost-sca
scan_types:
  - sca
  - license

config:
  require_full_repo: true
  support_diff_scan: true
  include_files:
    # C/C++ https://trivy.dev/v0.61/docs/coverage/language/c/
    - conan.lock
    # Dart https://trivy.dev/v0.61/docs/coverage/language/dart/
    - pubspec.lock
    # Dotnet https://trivy.dev/v0.61/docs/coverage/language/dotnet/
    - "*.deps.json"
    - packages.config
    - "*Packages.props"
    - packages.lock.json
    # Elixir https://trivy.dev/v0.61/docs/coverage/language/elixir/
    - mix.lock
    # Go https://trivy.dev/v0.61/docs/coverage/language/golang/
    - go.mod
    # Java https://trivy.dev/v0.61/docs/coverage/language/java/
    - "*gradle.lockfile"
    - pom.xml
    - "*.sbt.lock"
    # NodeJs https://trivy.dev/v0.61/docs/coverage/language/nodejs/
    - package-lock.json
    - yarn.lock
    - pnpm-lock.yaml
    # Php https://trivy.dev/v0.61/docs/coverage/language/php/
    - composer.lock
    - installed.json
    # Python https://trivy.dev/v0.61/docs/coverage/language/python/
    - Pipfile.lock
    - requirements.txt
    - poetry.lock
    - uv.lock
    # Ruby https://trivy.dev/v0.61/docs/coverage/language/ruby/
    - Gemfile.lock
    - .gemspec
    # RUST https://trivy.dev/v0.61/docs/coverage/language/rust/
    - Cargo.lock
    # Swift https://trivy.dev/v0.61/docs/coverage/language/swift/
    - Package.resolved
    - Podfile.lock
    # Julia https://trivy.dev/v0.61/docs/coverage/language/julia/
    - Manifest.toml

setup:
  - name: Utility scripts
    run: |
      mkdir -p $SETUP_PATH/pre-scan-checks/
      cp $REGISTRY_PATH/scanners/boostsecurityio/trivy-fs/prescan_checks.sh $SETUP_PATH/pre-scan-checks/trivy
  - name: download trivy
    environment:
      VERSION: 0.69.2
      LINUX_X86_64_SHA: 65b5755bbc851699be0286b453b51c3b1f139a8c1ce731f444210eeaf9a1aa61
      LINUX_ARM64_SHA: 524e496954c761ce5cd9c92baf2f7c2180958015bc25edad31570e102592a37c
      MACOS_ARM64_SHA: 28243bee903a5e00fe9074baeb9e57c51ae05514261a53da66ef7f2cc0b352f9
    run: |
      BINARY_URL="https://assets.build.boostsecurity.io/scanners/trivy/trivy-${VERSION}"
      ARCH=$(uname -m)

      case "$(uname -sm)" in
        "Linux x86_64")
          BINARY_URL="${BINARY_URL}/linux/amd64/trivy.gz"
          SHA="${LINUX_X86_64_SHA} trivy.gz"
          ;;
        "Linux aarch64")
          BINARY_URL="${BINARY_URL}/linux/arm64/trivy.gz"
          SHA="${LINUX_ARM64_SHA} trivy.gz"
          ;;
        "Darwin arm64")
          BINARY_URL="${BINARY_URL}/darwin/arm64/trivy.gz"
          SHA="${MACOS_ARM64_SHA} trivy.gz"
          ;;
        *)
          echo "Unsupported machine: ${OPTARG}"
          exit 1
          ;;
      esac

      curl -o trivy.gz -fsSL "${BINARY_URL}"
      echo "${SHA}" | sha256sum --check

      gunzip trivy.gz
      chmod +x trivy

steps:
  - run: $SETUP_PATH/pre-scan-checks/trivy
  - scan:
      command:
        environment:
          NO_COLOR: "true"
          TRIVY_ADDITIONAL_ARGS: ${TRIVY_ADDITIONAL_ARGS---ignore-unfixed}
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        run: |
          set +e
          LOG=$(mktemp)
          $SETUP_PATH/trivy fs --cache-dir=/tmp/trivy/ \
                               --format=json \
                               --output=trivy-report.json \
                               --license-full \
                               --no-progress \
                               --scanners vuln \
                               --skip-version-check \
                               . 2>"$LOG"
          ec=$?
          if [ "$ec" -eq 0 ]; then
            $SETUP_PATH/trivy convert --quiet --format cyclonedx trivy-report.json 2>>"$LOG"
            ec=$?
          fi
          # trivy's logs carry the "no language files" signal AND its fatal errors;
          # both readers consume a different stream, so emit the logs to each:
          cat "$LOG"      # stdout: the post-processor reads the "no language files" count here
          cat "$LOG" >&2  # stderr: the CLI's failure telemetry only reads stderr, so errors surface
          exit "$ec"
      format: cyclonedx
      post-processor:
        docker:
          image: public.ecr.aws/boostsecurityio/boost-scanner-trivy-sbom:8397e43@sha256:9e10985966c229deac734de6dda6064ec13a9851ce824d589ba9206c87c87e97
          command: process
          # not /app: srcdir is bind-mounted at workdir and the image lives under /app
          workdir: /scan
          environment:
            PYTHONIOENCODING: utf-8

enrichment:
  enable_on_diff_scan: ${BOOST_SCA_REACHABILITY_DIFF_SCAN_ENABLED:-false}
  docker:
    image: public.ecr.aws/boostsecurityio/boost-scanner-trivy-sbom:8397e43@sha256:9e10985966c229deac734de6dda6064ec13a9851ce824d589ba9206c87c87e97
    command: reachability
    # not /app: srcdir is bind-mounted at workdir and the image lives under /app
    workdir: /scan
    environment:
      PYTHONIOENCODING: utf-8
      BOOST_SCA_REACHABILITY: ${BOOST_SCA_REACHABILITY:-false}
      BOOST_SCA_THREATRANK_URL: https://assets.build.boostsecurity.io/scanners/threatrank/threatrank-1.0.7/linux/amd64/threatrank.tar.gz
      BOOST_SCA_THREATRANK_SHA256: 47e4fd65efec397d963c87e3313e46fad3601b46e65c16a11c8320d39040c5c8
