api_version: 1.0

id: boostsecurityio/trivy-sbom-image
name: Trivy (Image SBOM)
namespace: boostsecurityio/trivy-sbom-image
scan_types:
  - sbom

config:
  support_diff_scan: false

setup:
  - name: download trivy
    environment:
      VERSION: 0.76.2
      LINUX_X86_64_SHA: af009edb086f3beeb1ce2e091f3ee4ecdd1729bbf410d7e4eb2443bf9af2301c
      LINUX_ARM64_SHA: 57649ada6c9a04c78a82f6ef3f51ce0bc95f6fef08708aaec4c8406e2b3b19cd
      MACOS_ARM64_SHA: 51650866ac54e0173d65acfd4be37779a289d322dbd0c435eed85143e02ad1c8
    run: |
      BINARY_URL="https://assets.build.boostsecurity.io/scanners/trivy/trivy-${VERSION}"
      ARCH=$(uname -m)

      case "$(uname -sm)" in
        "Linux x86_64")
          BINARY_URL="${BINARY_URL}/linux/amd64/trivy.gz"
          SHA="${LINUX_X86_64_SHA} trivy.gz"
          ;;
        "Linux aarch64")
          BINARY_URL="${BINARY_URL}/linux/arm64/trivy.gz"
          SHA="${LINUX_ARM64_SHA} trivy.gz"
          ;;
        "Darwin arm64")
          BINARY_URL="${BINARY_URL}/darwin/arm64/trivy.gz"
          SHA="${MACOS_ARM64_SHA} trivy.gz"
          ;;
        *)
          echo "Unsupported machine: ${OPTARG}"
          exit 1
          ;;
      esac

      curl -o trivy.gz -fsSL "${BINARY_URL}"
      echo "${SHA}" | sha256sum --check

      gunzip trivy.gz
      chmod +x trivy

steps:
  - scan:
      command:
        environment:
          IMAGE_NAME: ${BOOST_IMAGE_NAME}
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        # keep --scanners "": --format json defaults to vuln,secret (cyclonedx didn't) -> convert would add vulns
        run: >
          $SETUP_PATH/trivy image
          ${TRIVY_ADDITIONAL_ARGS}
          --format json
          --output trivy-report.json
          --scanners ""
          --list-all-pkgs
          --license-full
          --skip-version-check
          ${BOOST_IMAGE_NAME}
          &&
          $SETUP_PATH/trivy convert --quiet --format cyclonedx trivy-report.json
      format: cyclonedx
      post-processor:
        docker:
          image: public.ecr.aws/boostsecurityio/boost-scanner-trivy-sbom:385532b@sha256:b56ef7f688074c8b6e8c2996f6626a641973f2b7bb1ff70143474db9cc900d7f
          command: process
          # not /app: srcdir is bind-mounted at workdir and the image lives under /app
          workdir: /scan
          environment:
            PYTHONIOENCODING: utf-8
